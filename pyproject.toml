[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    {name = "Beau Barker", email = "beau@explodinglabs.com"}
]
classifiers = [
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]
description = "Send JSON-RPC requests"
license = {file = "LICENSE"}
name = "jsonrpcclient"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.6"
version = "4.0.3"

[project.urls]
homepage = "https://explodinglabs.com/jsonrpcclient/"
repository = "https://github.com/explodinglabs/jsonrpcclient"

[project.optional-dependencies]
qa = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
include-package-data = true
packages = [
    "jsonrpcclient"
]
zip-safe = false

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
# mypy only accepts 3.10 or later here. pyright checks the 3.8 target.
python_version = "3.10"
strict = true
files = ["jsonrpcclient", "tests"]

[tool.pyright]
include = ["jsonrpcclient", "tests"]
pythonVersion = "3.8"
typeCheckingMode = "strict"
# Use "# pyright: ignore[...]" so mypy and pyright ignores are checked separately.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jsonrpcclient"]

[tool.coverage.report]
exclude_also = ["@overload"]
fail_under = 100
show_missing = true
