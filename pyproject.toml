[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "jsonrpcclient"
dynamic = ["version"]
description = "Create JSON-RPC 2.0 requests and parse responses in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    {name = "Beau Barker", email = "beau@explodinglabs.com"},
]
maintainers = [
    {name = "Synapse Research"},
]
keywords = ["json-rpc", "jsonrpc", "json-rpc-2.0", "rpc", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://bensynapse.github.io/jsonrpcclient/"
Documentation = "https://bensynapse.github.io/jsonrpcclient/"
Repository = "https://github.com/bensynapse/jsonrpcclient"
Issues = "https://github.com/bensynapse/jsonrpcclient/issues"
Changelog = "https://bensynapse.github.io/jsonrpcclient/changelog/"

[project.optional-dependencies]
qa = [
    "pytest",
    "pytest-cov",
]

[tool.flit.sdist]
include = [
    "CHANGELOG.md",
    "docs/",
    "overrides/",
    "mkdocs.yml",
    "requirements/",
    "tests/",
    "tox.ini",
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.format]
# Their code blocks include files with "--8<--" lines, which aren't Python.
exclude = ["docs/index.md", "docs/typing.md", "docs/transports/*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
# mypy only accepts 3.10 or later here. pyright checks the 3.8 target.
python_version = "3.10"
strict = true
files = ["jsonrpcclient", "tests", "docs/examples/typing_example.py"]

[tool.pyright]
include = ["jsonrpcclient", "tests", "docs/examples/typing_example.py"]
pythonVersion = "3.8"
typeCheckingMode = "strict"
# Use "# pyright: ignore[...]" so mypy and pyright ignores are checked separately.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jsonrpcclient"]

[tool.coverage.report]
exclude_also = ["@overload"]
fail_under = 100
show_missing = true
